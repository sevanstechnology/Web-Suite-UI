{% extends "suite/portal.html" %}
{% block title %}My devices{% endblock %}
{% block content %}
<div class="portal-hello"><h1>Hi Steve</h1><p class="sub">Register and manage the devices you use on the Wi-Fi.</p></div>
<div class="panel"><h2>Register a device</h2><p class="sub">Give it a name you'll recognise.</p>
  <div class="fields"><div><label>Device name</label><input type="text" placeholder="Steve's iPad"></div><div><label>MAC address</label><input type="text" class="mono" placeholder="aa:bb:cc:dd:ee:ff"></div></div>
  <p style="margin-top:18px"><button class="btn primary">Register</button></p></div>
{% endblock %}
