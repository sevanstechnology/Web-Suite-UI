name: Release
# Push a tag like v0.2.0 (matching VERSION) to publish a GitHub release with the Python wheel and the static zip.
on:
  push: { tags: ["v*"] }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check the tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: pip install build -e ".[dev]" && pytest -q
      - run: python -m build && ./scripts/build-static.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/suite-ui-*.zip
          generate_release_notes: true
