[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "suite-ui"
dynamic = ["version"]
description = "Shared Fluent / Microsoft 365-style shell (app launcher, navigation, theming) for Sevans Technology apps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1", "markupsafe>=2.1"]

[project.optional-dependencies]
fastapi = ["starlette>=0.36"]
flask = ["flask>=3.0"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29", "jsonschema>=4.21"]

[project.urls]
Source = "https://github.com/sevanstechnology/Web-Suite-UI"

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/suite_ui"]

[tool.hatch.build.targets.sdist]
include = ["src/suite_ui", "VERSION", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
